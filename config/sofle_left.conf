# Settings that only apply to the left (central) half.

# Fetch the right half's battery level over the split link so the left
# OLED can show it, and proxy it to the host so the OS shows both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
